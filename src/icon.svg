<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Forklift">
  <!--
    A counterbalance forklift, facing left, with a pallet on the forks.

    Two colours and no gradients: hi-vis lime for the machine — the colour of a warehouse, and
    unused anywhere else in this family of plugins — against slate for the load and the tyres, so
    the silhouette still reads at 16 pixels in the plugin store list.
  -->
  <g fill="none" fill-rule="evenodd">
    <!-- Overhead guard -->
    <path d="M46 20h30a4 4 0 0 1 4 4v3H50v-3a4 4 0 0 0-4-4z" fill="#AECD2A"/>
    <path d="M50 24h4v22h-4zM76 24h4v20h-4z" fill="#AECD2A"/>

    <!-- Counterweight body and cab -->
    <path d="M52 46h32a6 6 0 0 1 6 6v18H52z" fill="#AECD2A"/>

    <!-- Mast: two rails and the carriage -->
    <path d="M34 14h6v62h-6zM43 14h5v62h-5z" fill="#AECD2A"/>
    <rect x="32" y="40" width="18" height="6" rx="1" fill="#AECD2A"/>

    <!-- Forks -->
    <path d="M34 66h4v14H34z" fill="#AECD2A"/>
    <path d="M10 74h28v6H10z" fill="#AECD2A"/>

    <!-- The pallet and its load -->
    <rect x="12" y="66" width="22" height="5" rx="1" fill="#2B3440"/>
    <rect x="14" y="44" width="18" height="20" rx="2" fill="#2B3440"/>

    <!-- Tyres -->
    <circle cx="62" cy="76" r="10" fill="#2B3440"/>
    <circle cx="62" cy="76" r="4" fill="#AECD2A"/>
    <circle cx="84" cy="78" r="8" fill="#2B3440"/>
    <circle cx="84" cy="78" r="3" fill="#AECD2A"/>
  </g>
</svg>
